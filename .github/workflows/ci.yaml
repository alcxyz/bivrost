name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promotion:
    name: Promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check-promotion.py
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o dist/bivrost ./cmd/bivrost
      - run: python scripts/release.py check-version
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  snapshot:
    name: Release snapshot
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - run: python3 scripts/check-release-archives.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bivrost-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          retention-days: 7
  release:
    name: Publish release
    needs: [promotion, test, snapshot]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bivrost-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Resolve version and tag
        id: version
        run: python3 scripts/release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: steps.version.outputs.should_release == 'true'
        with:
          version: v2.18.2
          args: release --clean --skip=publish
      - name: Verify and publish missing assets
        if: steps.version.outputs.should_release == 'true'
        run: python3 scripts/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
