version: 2

project_name: bivrost

builds:
  - id: bivrost
    main: ./cmd/bivrost
    binary: bivrost
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}

archives:
  - id: bivrost
    ids:
      - bivrost
    name_template: "bivrost_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: config.example.json
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644

checksum:
  name_template: "bivrost_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: alcxyz
    name: bivrost
  draft: true

# GoReleaser only generates the cask and PKGBUILD from the archives above.
# scripts/release.py pushes them after the release is published (ADR 0007).
homebrew_casks:
  - name: bivrost
    skip_upload: true
    repository:
      owner: alcxyz
      name: homebrew-tap
    homepage: https://github.com/alcxyz/bivrost
    description: Local Azure Bastion sessions for Kubernetes and Podman workflows
    license: MIT
    hooks:
      post:
        # The binaries are not signed or notarized.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bivrost"]
          end

aurs:
  - name: bivrost-bin
    skip_upload: true
    homepage: https://github.com/alcxyz/bivrost
    description: Local Azure Bastion sessions for Kubernetes and Podman workflows
    maintainers:
      - alcxyz <alcxyz@users.noreply.github.com>
    license: MIT
    git_url: ssh://aur@aur.archlinux.org/bivrost-bin.git
    provides:
      - bivrost
    conflicts:
      - bivrost
    depends:
      - azure-cli
      - openssh
    optdepends:
      - "kubectl: Kubernetes access"
      - "azure-kubelogin: Kubernetes access"
      - "podman: registry access"
    package: |-
      install -Dm755 "./bivrost" "${pkgdir}/usr/bin/bivrost"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/bivrost/README.md"
      install -Dm644 "./config.example.json" "${pkgdir}/usr/share/doc/bivrost/config.example.json"
